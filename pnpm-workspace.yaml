packages:
  - 'apps/*'

# pnpm 10 は既定で依存のインストール時スクリプトを実行しない。
# ここに挙げたものは実体（ネイティブのバイナリ）を取りに行く必要があり、
# 実行させないと Medusa のビルドと起動が失敗する。
onlyBuiltDependencies:
  - '@medusajs/telemetry'
  - '@swc/core'
  - esbuild
  - msgpackr-extract
  - protobufjs

# Mercur / Medusa は 2.18.0 系で揃える必要がある。1つでも版がずれると
# 実行時に「同じ型の別インスタンス」ができて解決に失敗する。
# 出典: Mercur の templates/basic/package.json（resolutions / overrides / pnpm.overrides）
overrides:
  '@medusajs/admin-sdk': 2.18.0
  '@medusajs/admin-shared': 2.18.0
  '@medusajs/cli': 2.18.0
  '@medusajs/core-flows': 2.18.0
  '@medusajs/dashboard': 2.18.0
  '@medusajs/draft-order': 2.18.0
  '@medusajs/framework': 2.18.0
  '@medusajs/icons': 2.18.0
  '@medusajs/medusa': 2.18.0
  '@medusajs/test-utils': 2.18.0
  '@medusajs/types': 2.18.0
  '@medusajs/ui': 4.1.19
  zod: 3.25.76
